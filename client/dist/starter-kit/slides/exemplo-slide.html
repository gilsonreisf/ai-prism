<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* slides são autorados num palco FIXO de 1280×720 (o inspetor escala) */
  body { margin: 0; width: 1280px; height: 720px; overflow: hidden; padding: 72px 88px; box-sizing: border-box; }
  .kicker { color: var(--acme-lava); font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
  h1 { color: var(--acme-navy); font-size: 52px; margin: 12px 0 40px; max-width: 900px; }
  ul { font-size: 26px; color: var(--acme-ink); line-height: 1.5; max-width: 820px; }
  li { margin-bottom: 14px; }
  li::marker { color: var(--acme-lava); }
  .foot { position: absolute; bottom: 36px; left: 88px; font-size: 15px; color: var(--acme-gray-text); }
</style>
</head>
<body>
  <div class="kicker">Exemplo de conteúdo</div>
  <h1>Um título curto, em sentence case, sem ponto final</h1>
  <ul>
    <li>Uma ideia por bullet, no máximo duas linhas</li>
    <li>Números sempre com contexto e fonte</li>
    <li>Destaque em lava para no máximo um elemento por slide</li>
  </ul>
  <div class="foot">Preparado para &lt;cliente&gt; · ACME</div>
</body>
</html>
