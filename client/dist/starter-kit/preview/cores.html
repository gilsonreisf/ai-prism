<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; }
  h2 { font-size: 18px; margin: 0 0 14px; color: var(--acme-navy); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 130px; border-radius: 10px; overflow: hidden; border: 1px solid #ddd; }
  .sw .chip { height: 56px; }
  .sw .meta { padding: 6px 8px; font-size: 11px; }
  .sw .meta b { display: block; }
</style>
</head>
<body>
  <h2>Paleta ACME — tokens e uso</h2>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--acme-navy)"></div><div class="meta"><b>Navy</b>capas, divisores, texto forte</div></div>
    <div class="sw"><div class="chip" style="background:var(--acme-lava)"></div><div class="meta"><b>Lava</b>ação/destaque — 1 por slide</div></div>
    <div class="sw"><div class="chip" style="background:var(--acme-coral)"></div><div class="meta"><b>Coral</b>acentos secundários</div></div>
    <div class="sw"><div class="chip" style="background:var(--acme-oat-light)"></div><div class="meta"><b>Oat light</b>fundo padrão de conteúdo</div></div>
    <div class="sw"><div class="chip" style="background:var(--acme-green)"></div><div class="meta"><b>Green</b>positivo/sucesso em dados</div></div>
    <div class="sw"><div class="chip" style="background:var(--acme-yellow)"></div><div class="meta"><b>Yellow</b>atenção em dados</div></div>
  </div>
</body>
</html>
