<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--acme-navy); color: #fff; padding: 88px; box-sizing: border-box; position: relative; }
  img.logo { height: 40px; }
  .kicker { color: var(--acme-coral); font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; margin-top: 120px; }
  h1 { font-size: 64px; margin: 16px 0 20px; max-width: 760px; }
  .sub { font-size: 26px; color: rgba(255,255,255,.75); max-width: 700px; }
  img.art { position: absolute; right: 60px; top: 140px; width: 380px; opacity: .95; }
  .foot { position: absolute; bottom: 44px; left: 88px; font-size: 15px; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
  <img class="logo" src="../../assets/acme-logo-white.svg" alt="ACME">
  <img class="art" src="../../assets/illustration-network.svg" alt="">
  <div class="kicker">Apresentação institucional</div>
  <h1>Título da apresentação em uma frase forte</h1>
  <div class="sub">Subtítulo que explica o valor para este cliente específico.</div>
  <div class="foot">Preparado para &lt;cliente&gt; · ACME · 2026</div>
</body>
</html>
