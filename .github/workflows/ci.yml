name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-qa:
    name: Build & QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        # Usa o registry público (registry-url acima): fora da VPN da Databricks o
        # proxy interno (npm-proxy.cloud.databricks.com) é inalcançável e o `npm ci`
        # pendura em silêncio. As URLs do package-lock.json apontam para o registry
        # público; localmente, o `~/.npmrc` + replace-registry-host as reescrevem
        # transparentemente para o proxy interno.
        # --include=dev: o .npmrc do repo tem omit=dev (o app deployado roda
        # pré-compilado), mas TODO o toolchain vive em devDependencies.
        # --ignore-scripts: pula o postinstall do esbuild (baixa binário da rede); o
        # binário já vem do pacote optional @esbuild/linux-x64 no lockfile.
        run: npm ci --include=dev --ignore-scripts

      - name: QA (checagens offline de deck/planilha/documento)
        run: npm run qa

      - name: Build (client + server)
        run: npm run bundle

  changelog:
    name: Changelog atualizado
    runs-on: ubuntu-latest
    # Só em PRs; pulável com a label "skip-changelog" para mudanças que não exigem entrada.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verifica se CHANGELOG.md foi alterado
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qx 'CHANGELOG.md'; then
            echo "✓ CHANGELOG.md foi atualizado."
          else
            echo "::error::CHANGELOG.md não foi atualizado. Adicione uma entrada em '## [Unreleased]'"
            echo "ou aplique a label 'skip-changelog' se a mudança não for relevante (docs/chore/CI)."
            exit 1
          fi
