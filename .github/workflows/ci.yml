name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-qa:
    name: Build & QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Upgrade npm
        # O npm 10.9.x que vem com o Node 22 pendura o `npm ci` no runner e morre com
        # "Exit handler never called!" (bug do próprio npm). O npm 11 corrige.
        run: npm install -g npm@11

      - name: Install dependencies
        # --include=dev: o .npmrc define omit=dev (o app deployado roda pré-compilado
        # e não precisa de pacotes no install da Databricks), mas TODO o toolchain do
        # projeto vive em devDependencies, então o CI precisa incluí-las.
        # --ignore-scripts: pula o postinstall do esbuild (baixa binário da rede); o
        # binário já vem do pacote optional @esbuild/linux-x64 no lockfile.
        # --maxsockets 1: o `npm ci` deadlocka em silêncio neste runner (roda em 4s
        # localmente). Serializar as conexões evita o deadlock do pool de sockets do
        # npm em CI. --loglevel=silly deixa o progresso visível se ainda travar.
        run: npm ci --include=dev --ignore-scripts --maxsockets 1 --loglevel=silly

      - name: QA (checagens offline de deck/planilha/documento)
        run: npm run qa

      - name: Build (client + server)
        run: npm run bundle

  changelog:
    name: Changelog atualizado
    runs-on: ubuntu-latest
    # Só em PRs; pulável com a label "skip-changelog" para mudanças que não exigem entrada.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica se CHANGELOG.md foi alterado
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qx 'CHANGELOG.md'; then
            echo "✓ CHANGELOG.md foi atualizado."
          else
            echo "::error::CHANGELOG.md não foi atualizado. Adicione uma entrada em '## [Unreleased]'"
            echo "ou aplique a label 'skip-changelog' se a mudança não for relevante (docs/chore/CI)."
            exit 1
          fi
