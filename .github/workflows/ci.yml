name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-qa:
    name: Build & QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Sem `cache: npm`: o cache do setup-node interage mal com o `.npmrc omit=dev`
          # deste repo e pendura o `npm ci` no runner. O install é rápido (~poucos
          # segundos, 23 devDeps) e não precisa de cache.

      - name: Install dependencies
        # O .npmrc define omit=dev (o app deployado roda pré-compilado e não precisa
        # de pacotes no install da Databricks). Mas TODAS as deps do projeto vivem em
        # devDependencies, então o CI precisa de --include=dev para rodar QA e build.
        # Com timeout + 1 retry: o install já pendurou em silêncio no runner
        # ("Exit handler never called!"), um bug transitório do npm; o retry recupera.
        run: |
          for attempt in 1 2; do
            echo "::group::npm ci (tentativa $attempt)"
            if timeout 300 npm ci --include=dev --foreground-scripts; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "npm ci falhou/pendurou na tentativa $attempt; limpando e tentando de novo."
            rm -rf node_modules
          done
          echo "::error::npm ci falhou após 2 tentativas."
          exit 1

      - name: QA (checagens offline de deck/planilha/documento)
        run: npm run qa

      - name: Build (client + server)
        run: npm run bundle

  changelog:
    name: Changelog atualizado
    runs-on: ubuntu-latest
    # Só em PRs; pulável com a label "skip-changelog" para mudanças que não exigem entrada.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica se CHANGELOG.md foi alterado
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qx 'CHANGELOG.md'; then
            echo "✓ CHANGELOG.md foi atualizado."
          else
            echo "::error::CHANGELOG.md não foi atualizado. Adicione uma entrada em '## [Unreleased]'"
            echo "ou aplique a label 'skip-changelog' se a mudança não for relevante (docs/chore/CI)."
            exit 1
          fi
