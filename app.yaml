command:
  - "node"
  - "server-dist/index.cjs"

# Minimum scopes for every API the server calls on behalf of the user:
# model-serving (AI Gateway), genie (spaces list + Genie One MCP),
# sql (Statement Execution: UC Function discovery/exec + built-in Python tool),
# vector-search (endpoints/indexes/query), catalog.connections + mcp.external
# (external MCP connections). UC Functions run via SQL, not the managed
# functions MCP, so mcp.functions is not needed.
user_authorization:
  scopes:
    - model-serving
    - genie
    - sql
    - vector-search
    - catalog.connections
    - mcp.external
    # files: read/write the UC Volume that stores generated images (Files API,
    # on-behalf-of the user) — see server/imageStore.js
    - files

env:
  - name: NODE_ENV
    value: 'production'
  # bootstrap admin: this identity is always an app admin and can add other
  # admins (users/groups) via the in-app admin panel (see server/authz.js)
  - name: APP_OWNER_EMAIL
    value: 'pedro.ramos@databricks.com'
  # used by the admin-candidates autocomplete (permissions API is keyed by
  # app NAME); set explicitly in case the runtime doesn't inject it
  - name: DATABRICKS_APP_NAME
    value: 'ai-prism'
  - name: PORT
    value: '8000'
  # NOTE: the values below are local-dev / E2_Demo defaults ONLY. A `databricks
  # bundle deploy` does NOT use this file's env — the deployed app's config comes
  # from databricks.yml (apps.ai_prism.config.env), which wires PGHOST, catalogs,
  # warehouse and image volume per-workspace from the bundle's own resources. So
  # this AWS host is never used on a bundle deploy (Azure/GCP included); it's just
  # what a bare `npm start` against E2 points at.
  - name: PGHOST
    value: 'ep-rough-smoke-d16ogta3.database.us-west-2.cloud.databricks.com'
  - name: PGDATABASE
    value: 'databricks_postgres'
  - name: PGPORT
    value: '5432'
  - name: PGSSLMODE
    value: 'require'
  - name: SQL_WAREHOUSE_ID
    value: '75718e4268126449'
  - name: TOOLS_CATALOG
    value: 'main'
  - name: TOOLS_SCHEMA
    value: 'default'
  # Where generated images are stored (own catalog, kept separate from other
  # assets). On E2_Demo we use the pedro_ramos catalog; a fresh bundle deploy
  # defaults to a dedicated `ai_prism` catalog. The app service principal is
  # granted READ/WRITE VOLUME here; per-user isolation is app-level (user_email).
  - name: IMAGE_VOLUME_CATALOG
    value: 'pedro_ramos'
  - name: IMAGE_VOLUME_SCHEMA
    value: 'default'
  - name: IMAGE_VOLUME_NAME
    value: 'ai_prism_images'
