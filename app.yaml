command:
  - "node"
  - "server-dist/index.cjs"

# Minimum scopes for every API the server calls on behalf of the user:
# model-serving (AI Gateway), genie (spaces list + Genie One MCP),
# sql (Statement Execution: UC Function discovery/exec + built-in Python tool),
# vector-search (endpoints/indexes/query), catalog.connections + mcp.external
# (external MCP connections). UC Functions run via SQL, not the managed
# functions MCP, so mcp.functions is not needed.
user_authorization:
  scopes:
    - model-serving
    - genie
    - sql
    - vector-search
    - catalog.connections
    - mcp.external
    # files: read/write the UC Volume that stores generated images (Files API,
    # on-behalf-of the user) — see server/imageStore.js
    - files

# IMPORTANT: never hardcode workspace-specific infra here (Lakebase host, warehouse
# id, catalogs). The Apps runtime reads env from this file, so a hardcoded host
# would point the app at the WRONG (e.g. another cloud's) Lakebase and fail every
# DB call with SQLSTATE 28000 "External authorization failed".
#
# The Lakebase connection is delivered via an APP RESOURCE (key: `lakebase`,
# declared in databricks.yml). `valueFrom: lakebase` injects that resource's
# endpoint PATH at runtime, and the resource also auto-injects PGHOST; the app
# resolves the real host + a connection JWT at boot (lakebaseHost() in
# server/db.js). SQL_WAREHOUSE_ID comes from the `sql-warehouse` resource the
# same way. The bundle's databricks.yml config.env does NOT reach the running app
# (verified), so ALL env lives HERE. For LOCAL dev (bare `npm start`, no bundle),
# export PGHOST + SQL_WAREHOUSE_ID in your shell.
env:
  - name: NODE_ENV
    value: 'production'
  - name: DATABRICKS_APP_NAME
    value: 'ai-prism'
  - name: PORT
    value: '8000'
  - name: PGPORT
    value: '5432'
  - name: PGSSLMODE
    value: 'require'
  - name: PGDATABASE
    value: 'databricks_postgres'
  # Lakebase endpoint path, injected from the `lakebase` app resource. The app
  # resolves host + connection token from it at boot (server/db.js lakebaseHost()).
  # (The `lakebase` resource also auto-injects PGHOST directly.)
  - name: PG_ENDPOINT
    valueFrom: 'lakebase'
  # SQL warehouse id, injected from the `sql-warehouse` app resource (declared in
  # databricks.yml). The app runtime reads env from THIS file plus resource
  # injections — the bundle's databricks.yml config.env does NOT reach the running
  # app — so warehouse/PG must arrive via app.yaml + resources, never config.env.
  - name: SQL_WAREHOUSE_ID
    valueFrom: 'sql-warehouse'
  # Tools UDF + image-store locations. Everything AI Prism owns lives in the
  # dedicated `ai_prism` catalog (built-in Python UDF and the image volume), so
  # it's all in one place. The app falls back to these same defaults in code.
  - name: TOOLS_CATALOG
    value: 'ai_prism'
  - name: TOOLS_SCHEMA
    value: 'default'
  - name: IMAGE_VOLUME_CATALOG
    value: 'ai_prism'
  - name: IMAGE_VOLUME_SCHEMA
    value: 'default'
  - name: IMAGE_VOLUME_NAME
    value: 'ai_prism_images'
